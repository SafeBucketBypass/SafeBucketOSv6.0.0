<body><main class="desktop" id="desktop">
<header class="topbar"><div class="brandline"><img class="brandmark asset" data-asset="SafeBucketLogo.png" alt=""/><span class="brandname">Safe Bucket</span><span class="top-divider"></span><span class="menulink">Desktop</span><span class="menulink">Workspace</span></div><div class="statusline"><span class="statuspill"><i class="status-dot"></i> System ready</span><span class="top-divider"></span><span id="clock">--:--</span><button id="powerBtn" class="tool-btn" title="System menu">⋯</button></div></header>
<section class="desktop-area"><div class="desktop-icons" id="desktopIcons"></div><div class="hero"><img class="hero-symbol asset" data-asset="SafeBucketLogo.png" alt="Safe Bucket"/><h1>Make space for <span>what matters.</span></h1><p>A quieter place for your games, tools, and the things you use every day.</p><div class="quick-search"><span>⌕</span><input id="quickSearch" placeholder="Search apps or the web…" autocomplete="off"/><span class="keycap">ENTER</span></div></div><div class="context-hint">Double-click an app to open it<br/>Your space. Your setup.</div></section>
<div class="dock-wrap"><nav class="dock" id="dock"></nav></div><div class="toast" id="toast"></div><div class="power-menu hidden-menu" id="powerMenu"><button data-open="settings">⚙ &nbsp; System settings</button><button data-open="about">ⓘ &nbsp; About Safe Bucket</button><button id="hideWindows">▱ &nbsp; Show desktop</button></div>
</main>
<script>
const ASSET_DIR='Images/';
const apps=[
{id:'browser',name:'Browser',desc:'Browse the web',asset:null,emoji:'⌕',dock:true},
{id:'apps',name:'App Library',desc:'Your workspace',asset:null,emoji:'▦',dock:true},
{id:'images',name:'Images',desc:'Brand assets',asset:'SafeBucketLogo.png',emoji:'▧',dock:true},
{id:'games',name:'Games',desc:'Game shortcuts',asset:'Controller.png',emoji:'▹',dock:true},
{id:'movies',name:'Movies',desc:'Watch list',asset:'Movie.png',emoji:'▷',dock:false},
{id:'roblox',name:'Roblox',desc:'Roblox hub',asset:'Roblox.png',emoji:'◇',dock:false},
{id:'minecraft',name:'Minecraft',desc:'Block worlds',asset:'Minecraft.png',emoji:'▦',dock:false},
{id:'anime',name:'Anime',desc:'Anime hub',asset:'Anime.png',emoji:'✦',dock:false},
{id:'notes',name:'Notes',desc:'Quick notes',asset:null,emoji:'▤',dock:true},
{id:'settings',name:'Settings',desc:'Personalize OS',asset:null,emoji:'⚙',dock:false},
{id:'about',name:'About',desc:'About this project',asset:'CiphAnonStudios.png',emoji:'ⓘ',dock:false},
{id:'ai',name:'AI Tools',desc:'AI resources',asset:'AI.png',emoji:'✧',dock:false},
{id:'altserver',name:'Servers',desc:'Server shortcuts',asset:'AltServer.png',emoji:'⌘',dock:false}
];
const assetFiles=['SafeBucketLogo.png','Controller.png','Movie.png','Roblox.png','CiphAnonStudios.png','Anime.png','Minecraft.png','AltServer.png','AI.png'];
const appUrls={roblox:'https://www.roblox.com/',minecraft:'https://www.minecraft.net/',anime:'https://www.crunchyroll.com/',movies:'https://www.youtube.com/',ai:'https://chatgpt.com/',altserver:'https://eaglercraft.com/'};
const appDescriptions={games:'Choose a game or open a gaming website.',movies:'Your media shortcuts in one place.',roblox:'Open Roblox in the Safe Bucket browser or in a new tab.',minecraft:'Minecraft links and block-building resources.',anime:'Anime streaming and discovery shortcut.',ai:'Open an AI workspace in a new tab.',altserver:'A starting point for browser-based Minecraft and server links.'};
const $=s=>document.querySelector(s);const desktop=$('#desktop');let zTop=110,activeWindow=null,windowCount=0,windowMap={},historyByWindow={};
function appBy(id){return apps.find(a=>a.id===id)}
function assetImg(file,cls=''){return `<img class="${cls}" src="${ASSET_DIR}${file}" alt="" onerror="this.style.display='none';this.parentElement.querySelector('.icon-emoji')?.classList.remove('fallback-hidden')">`}
function iconTile(app,size=''){return `<span class="icon-tile ${size}">${app.asset?assetImg(app.asset):''}<span class="icon-emoji ${app.asset?'fallback-hidden':''}">${app.emoji||'◈'}</span></span>`}
function iconMarkup(app){return `<span class="icon-tile">${app.asset?`<img src="${ASSET_DIR+app.asset}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">`:''}<span class="icon-emoji" style="${app.asset?'display:none':''}">${app.emoji}</span></span>`}
function renderDesktop(){const desk=$('#desktopIcons'),dock=$('#dock');desk.innerHTML='';dock.innerHTML='';apps.filter(a=>['browser','apps','images','games','movies','roblox','minecraft','notes','settings'].includes(a.id)).forEach(app=>{const b=document.createElement('button');b.className='desk-icon';b.dataset.open=app.id;b.innerHTML=`${iconMarkup(app)}<span class="desk-label">${app.name}</span>`;b.addEventListener('dblclick',()=>openApp(app.id));b.addEventListener('click',()=>{document.querySelectorAll('.desk-icon').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});b.addEventListener('keydown',e=>{if(e.key==='Enter')openApp(app.id)});desk.append(b)});
const dockIds=['browser','apps','images','games','notes'];dockIds.forEach((id,i)=>{if(i===4){const sep=document.createElement('span');sep.className='dock-sep';dock.append(sep)}const app=appBy(id),b=document.createElement('button');b.className='dock-btn';b.dataset.open=id;b.setAttribute('aria-label',app.name);b.innerHTML=`${iconMarkup(app)}<span class="tooltip">${app.name}</span>`;b.onclick=()=>openApp(id);dock.append(b)})}
function windowShell(id,title,body,opts={}){let old=windowMap[id];if(old){old.classList.remove('hidden');focusWindow(old);return old}const w=document.createElement('section');w.className='window';w.dataset.window=id;w.style.zIndex=++zTop;w.style.left=`calc(50% + ${Math.min(windowCount%4*16,48)-24}px)`;w.style.top=`calc(50% + ${Math.min(windowCount%4*11,33)-17}px)`;windowCount++;w.innerHTML=`<header class="window-bar"><div class="traffic"><button class="close" title="Close" aria-label="Close"></button><button class="min" title="Minimize" aria-label="Minimize"></button><button class="max" title="Maximize" aria-label="Maximize"></button></div><div class="window-title">${title}</div></header><div class="window-body ${opts.noScroll?'no-scroll':''}">${body}</div>`;desktop.append(w);windowMap[id]=w;w.querySelector('.close').onclick=e=>{e.stopPropagation();w.remove();delete windowMap[id];updateDock()};w.querySelector('.min').onclick=e=>{e.stopPropagation();w.classList.add('hidden');updateDock()};w.querySelector('.max').onclick=e=>{e.stopPropagation();w.classList.toggle('maximized');focusWindow(w)};w.addEventListener('pointerdown',()=>focusWindow(w));makeDraggable(w);focusWindow(w);updateDock();return w}
function focusWindow(w){document.querySelectorAll('.window').forEach(x=>x.classList.remove('active'));w.classList.add('active');w.style.zIndex=++zTop;activeWindow=w;updateDock()}
function updateDock(){document.querySelectorAll('.dock-btn').forEach(b=>b.classList.toggle('open',!!windowMap[b.dataset.open]&&!windowMap[b.dataset.open].classList.contains('hidden')))}
function makeDraggable(w){const bar=w.querySelector('.window-bar');let sx=0,sy=0,ox=0,oy=0,drag=false;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button')||w.classList.contains('maximized'))return;drag=true;focusWindow(w);sx=e.clientX;sy=e.clientY;const r=w.getBoundingClientRect();ox=r.left;oy=r.top;bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(!drag)return;w.style.left=Math.max(0,Math.min(innerWidth-w.offsetWidth,ox+e.clientX-sx))+'px';w.style.top=Math.max(42,Math.min(innerHeight-100,oy+e.clientY-sy))+'px';w.style.transform='none'});bar.addEventListener('pointerup',()=>drag=false);bar.addEventListener('pointercancel',()=>drag=false)}
function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.remove('show'),2300)}
function openApp(id){$('#powerMenu').classList.add('hidden-menu');if(windowMap[id]){windowMap[id].classList.remove('hidden');focusWindow(windowMap[id]);return}let body='',title=appBy(id)?.name||id,opts={};switch(id){case'browser':body=browserBody();opts.noScroll=true;break;case'apps':body=appsBody();break;case'images':body=imagesBody();break;case'games':body=categoryBody('games',['roblox','minecraft','altserver']);break;case'movies':body=categoryBody('movies',['movies','anime']);break;case'roblox':body=launchBody('roblox');break;case'minecraft':body=launchBody('minecraft');break;case'anime':body=launchBody('anime');break;case'notes':body=notesBody();opts.noScroll=true;break;case'settings':body=settingsBody();break;case'about':body=aboutBody();break;case'ai':body=launchBody('ai');break;case'altserver':body=launchBody('altserver');break;default:body=appsBody()}const w=windowShell(id,title,body,opts);wireWindow(id,w);return w}
function appsBody(){return `<div class="app-header"><div class="eyebrow">Your workspace</div><h2>App Library</h2><p>Everything you need, kept in one place.</p></div><div class="app-content"><p class="section-label">ALL APPS</p><div class="app-grid">${apps.filter(a=>a.id!=='apps').map(a=>`<button class="app-card" data-launch="${a.id}">${iconMarkup(a)}<span><strong>${a.name}</strong><small>${a.desc}</small></span></button>`).join('')}</div><p class="app-footer">Some shortcuts open external websites. Website embedding depends on the site.</p></div>`}
function categoryBody(id,ids){return `<div class="app-header"><div class="eyebrow">Safe Bucket / ${id}</div><h2>${id==='games'?'Play something.': 'Watch something.'}</h2><p>${appDescriptions[id]}</p></div><div class="app-content"><p class="section-label">SHORTCUTS</p><div class="app-grid">${ids.map(x=>{const a=appBy(x);return `<button class="app-card" data-launch="${x}">${iconMarkup(a)}<span><strong>${a.name}</strong><small>${a.desc}</small></span></button>`}).join('')}</div></div>`}
function imagesBody(){return `<div class="app-header"><div class="eyebrow">Workspace / Assets</div><h2>Images</h2><p>Brand and app artwork from your local Images folder.</p></div><div class="app-content"><div class="gallery">${assetFiles.map(f=>`<div class="gallery-item"><div class="gallery-preview"><img src="${ASSET_DIR+f}" alt="${f}" onerror="this.outerHTML='<span class=\'icon-emoji\'>▧</span>'"></div><strong>${f}</strong><small>Images/${f}</small></div>`).join('')}</div><p class="app-footer">Keep these files inside an <b>Images</b> folder next to index.html for the artwork to load.</p></div>`}
function launchBody(id){const a=appBy(id),url=appUrls[id]||'https://example.com';return `<div class="app-header"><div class="eyebrow">Shortcut / ${a.name}</div><h2>${a.name}</h2><p>${appDescriptions[id]||a.desc}</p></div><div class="app-content"><div class="setting-row"><div style="display:flex;align-items:center;gap:13px">${iconMarkup(a)}<div><strong>${a.name}</strong><small>${url}</small></div></div><button class="shortcut" data-url="${url}">Open in new tab ↗</button></div><p class="app-footer">For the best compatibility, this shortcut opens the official website in a new browser tab. You can also try it inside the custom browser.</p><div style="margin-top:15px;display:flex;gap:8px;flex-wrap:wrap"><button class="shortcut" data-browser-url="${url}">Open inside Safe Bucket</button><button class="shortcut" data-open="browser">Open browser</button></div></div>`}
function browserBody(){return `<div style="height:100%;display:flex;flex-direction:column"><div class="browser-toolbar"><button class="tool-btn" data-browser-action="back" title="Back">‹</button><button class="tool-btn" data-browser-action="forward" title="Forward">›</button><button class="tool-btn" data-browser-action="reload" title="Reload">↻</button><button class="tool-btn" data-browser-action="home" title="Home">⌂</button><div class="addressbar"><span>⌕</span><input id="browserAddress" placeholder="Search or enter website address" spellcheck="false"/><button class="tool-btn" data-browser-action="go">↵</button></div><button class="tool-btn" data-browser-action="external" title="Open in new tab">↗</button></div><div id="browserView" style="flex:1;min-height:0;position:relative">${browserHome()}</div><div class="browser-message">Some websites block embedded browsing. If a page won't load, use ↗ to open it in a new tab.</div></div>`}
function browserHome(){return `<div class="browser-home"><img class="hero-symbol asset" data-asset="SafeBucketLogo.png" src="${ASSET_DIR}SafeBucketLogo.png" alt="" onerror="this.style.display='none'"><h2>Safe Bucket <span style="color:#858892">Browser</span></h2><p>A clean starting point for your next destination.</p><form class="browser-search" id="browserHomeForm"><span style="color:#888">⌕</span><input id="browserHomeInput" placeholder="Search the web or enter a URL"/><button class="tool-btn" type="submit">↵</button></form><div class="browser-shortcuts"><button class="shortcut" data-browser-url="https://www.google.com/">Google</button><button class="shortcut" data-browser-url="https://www.youtube.com/">YouTube</button><button class="shortcut" data-browser-url="https://www.roblox.com/">Roblox</button><button class="shortcut" data-browser-url="https://eaglercraft.com/">Eaglercraft</button></div></div>`}
function navigateBrowser(w,value){const input=w.querySelector('#browserAddress');if(!input)return;let raw=(value||input.value||'').trim();if(!raw)return;let url;if(/^(https?:\/\/)/i.test(raw))url=raw;else if(/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(raw))url='https://'+raw;else url='https://www.google.com/search?q='+encodeURIComponent(raw);input.value=url;const view=w.querySelector('#browserView');view.innerHTML=`<iframe class="browser-frame" referrerpolicy="no-referrer" sandbox="allow-forms allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox" src="${url.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"></iframe>`;historyByWindow[w.dataset.window]=historyByWindow[w.dataset.window]||[];historyByWindow[w.dataset.window].push(url);w.dataset.currentUrl=url}
function wireWindow(id,w){w.querySelectorAll('[data-launch]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.launch)));w.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.open)));w.querySelectorAll('[data-url]').forEach(b=>b.addEventListener('click',()=>window.open(b.dataset.url,'_blank','noopener,noreferrer')));w.querySelectorAll('[data-browser-url]').forEach(b=>b.addEventListener('click',()=>{const bw=openApp('browser');navigateBrowser(bw,b.dataset.browserUrl)}));if(id==='browser'){const address=w.querySelector('#browserAddress');const go=()=>navigateBrowser(w,address.value);address.addEventListener('keydown',e=>{if(e.key==='Enter')go()});w.querySelector('[data-browser-action="go"]').onclick=go;w.querySelector('[data-browser-action="external"]').onclick=()=>{const val=address.value.trim()||w.dataset.currentUrl;if(val)window.open(/^[a-z]+:\/\//i.test(val)?val:'https://'+val,'_blank','noopener,noreferrer')};w.querySelector('[data-browser-action="home"]').onclick=()=>{address.value='';w.querySelector('#browserView').innerHTML=browserHome();wireBrowserHome(w)};w.querySelector('[data-browser-action="reload"]').onclick=()=>{const v=w.dataset.currentUrl;if(v)navigateBrowser(w,v);else showToast('You are already on the browser home page.')};w.querySelector('[data-browser-action="back"]').onclick=()=>{const h=historyByWindow[id]||[];if(h.length>1){h.pop();navigateBrowser(w,h[h.length-1])}else showToast('No earlier page in this session.')};w.querySelector('[data-browser-action="forward"]').onclick=()=>showToast('Forward history is not available yet.');wireBrowserHome(w)}if(id==='notes'){const ta=w.querySelector('textarea');ta.value=localStorage.getItem('safebucket-notes')||'';ta.addEventListener('input',()=>{localStorage.setItem('safebucket-notes',ta.value);w.querySelector('#noteStatus').textContent='Saved automatically'})}if(id==='settings'){w.querySelector('#accentSelect').addEventListener('change',e=>setAccent(e.target.value));w.querySelector('#gridToggle').onclick=e=>{const on=e.currentTarget.classList.toggle('on');desktop.classList.toggle('no-grid',!on);desktop.style.setProperty('--grid-opacity',on?'.22':'0');desktop.style.setProperty('--unused','');desktop.querySelector('style')};w.querySelector('#resetSettings').onclick=()=>{localStorage.removeItem('sb-accent');localStorage.removeItem('sb-grid');setAccent('silver');desktop.classList.remove('no-grid');showToast('Appearance reset.')};const saved=localStorage.getItem('sb-accent');if(saved)w.querySelector('#accentSelect').value=saved;w.querySelector('#gridToggle').classList.toggle('on',localStorage.getItem('sb-grid')!=='off') }}
function wireBrowserHome(w){const form=w.querySelector('#browserHomeForm');if(form){form.onsubmit=e=>{e.preventDefault();navigateBrowser(w,w.querySelector('#browserHomeInput').value)};w.querySelectorAll('[data-browser-url]').forEach(b=>b.onclick=()=>navigateBrowser(w,b.dataset.browserUrl))}}
function notesBody(){return `<div class="note-area"><div class="note-toolbar"><span>QUICK NOTE</span><span id="noteStatus">Saved automatically</span></div><textarea placeholder="Write something down… Your notes stay in this browser on this device."></textarea></div>`}
function settingsBody(){return `<div class="app-header"><div class="eyebrow">System / Preferences</div><h2>Settings</h2><p>Make the desktop feel like yours.</p></div><div class="app-content"><div class="settings-list"><div class="setting-row"><div><strong>Accent tone</strong><small>Choose the subtle highlight used around the workspace.</small></div><select id="accentSelect"><option value="silver">Graphite silver</option><option value="orange">Studio orange</option><option value="blue">Cool blue</option><option value="violet">Soft violet</option></select></div><div class="setting-row"><div><strong>Desktop grid</strong><small>Show or hide the quiet background grid.</small></div><button class="toggle on" id="gridToggle" aria-label="Toggle desktop grid"></button></div><div class="setting-row"><div><strong>Local notes</strong><small>Notes are saved in this browser using local storage.</small></div><button class="shortcut" data-open="notes">Open notes</button></div><div class="setting-row"><div><strong>Brand assets</strong><small>Place your icons inside the Images folder.</small></div><button class="shortcut" data-open="images">View images</button></div></div><div style="margin-top:15px"><button class="shortcut" id="resetSettings">Reset appearance</button></div></div>`}
function aboutBody(){return `<div class="about-panel"><img class="about-logo" src="${ASSET_DIR}SafeBucketLogo.png" alt="Safe Bucket" onerror="this.style.display='none'"><div class="eyebrow">CiphAnon Studios Project</div><h2>Safe Bucket OS</h2><p>A custom desktop-style workspace for the Safe Bucket project. Built to bring your shortcuts, assets, and tools together in one interface.</p><span class="pill">Custom UI</span><span class="pill">Dark workspace</span><span class="pill">Local-first notes</span><p style="margin-top:22px">Creator: ToonyTime<br>Interface concept: Safe Bucket</p></div>`}
function setAccent(v){const map={silver:['233,233,235','#e9e9eb'],orange:['255,106,0','#ff6a00'],blue:['130,177,255','#82b1ff'],violet:['190,160,255','#bea0ff']};const p=map[v]||map.silver;document.documentElement.style.setProperty('--accent-rgb',p[0]);document.documentElement.style.setProperty('--accent',p[1]);localStorage.setItem('sb-accent',v);const st=document.createElement('style');st.textContent=`.status-dot{background:var(--accent)}.quick-search:focus-within,.addressbar:focus-within{border-color:rgba(var(--accent-rgb),.42)}.desk-icon.selected{border-color:rgba(var(--accent-rgb),.2)}`;document.head.append(st)}
$('#quickSearch').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const q=e.target.value.trim();if(!q)return;const match=apps.find(a=>a.name.toLowerCase()===q.toLowerCase()||a.id.toLowerCase()===q.toLowerCase());if(match){openApp(match.id)}else{const w=openApp('browser');navigateBrowser(w,q)}e.target.value=''});
$('#powerBtn').onclick=()=>$('#powerMenu').classList.toggle('hidden-menu');$('#powerMenu').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openApp(b.dataset.open));$('#hideWindows').onclick=()=>{Object.values(windowMap).forEach(w=>w.classList.add('hidden'));$('#powerMenu').classList.add('hidden-menu');updateDock()};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#powerMenu').classList.add('hidden-menu');if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#quickSearch').focus()}});
function updateClock(){const d=new Date();$('#clock').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}setInterval(updateClock,15000);updateClock();renderDesktop();const savedAccent=localStorage.getItem('sb-accent');if(savedAccent)setAccent(savedAccent);if(localStorage.getItem('sb-grid')==='off')desktop.classList.add('no-grid');
// Keep appearance toggles simple and persistent.
const gridStyle=document.createElement('style');gridStyle.textContent='.desktop.no-grid:before{opacity:0!important}';document.head.append(gridStyle);
// Settings listeners that are delegated so they work after the app is opened.
document.addEventListener('click',e=>{const t=e.target.closest('#gridToggle');if(t){const on=t.classList.contains('on');localStorage.setItem('sb-grid',on?'on':'off')}const r=e.target.closest('#resetSettings');if(r){setAccent('silver');localStorage.setItem('sb-grid','on');desktop.classList.remove('no-grid')}});
</script></body></html>
