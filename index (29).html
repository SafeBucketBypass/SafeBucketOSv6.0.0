const $=(s,r=document)=>r.querySelector(s), layer=$('#windowLayer'), desktop=$('#desktop'), windowMap=Object.create(null);let zTop=20,toastTimer;const browserStates=new WeakMap();
function icon(id){const a=apps.find(x=>x.id===id)||{id,name:id};let svg=iconSvg[id]||iconSvg.apps;let inside=a.asset?`<img src="${ASSET_DIR+a.asset}" alt="" onerror="this.remove();this.parentElement.insertAdjacentHTML('beforeend','<svg viewBox=\'0 0 24 24\'>${svg}</svg>')">`:`<svg viewBox="0 0 24 24">${svg}</svg>`;return `<span class="app-icon">${inside}</span>`}
function renderDesktop(){const rail=$('#desktopIcons');rail.innerHTML='<div class="rail-label">Apps</div>'+apps.slice(0,7).map(a=>`<button class="desktop-app" data-open="${a.id}" title="Open ${a.name}">${icon(a.id)}<span class="app-label">${a.name}</span></button>`).join('');$('#quickLaunch').innerHTML=['browser','games','movies','notes'].map(id=>`<button data-open="${id}">${icon(id)}<span>${apps.find(a=>a.id===id).name}</span></button>`).join('');$('#dock').innerHTML=['browser','games','movies','roblox','minecraft','anime','sep','images','notes','settings'].map(id=>id==='sep'?'<span class="dock-separator"></span>':`<button class="dock-button" data-open="${id}" aria-label="Open ${apps.find(a=>a.id===id).name}">${icon(id)}<span class="dock-tip">${apps.find(a=>a.id===id).name}</span></button>`).join('')}
function head(title,subtitle,kicker='WORKSPACE'){return `<div class="app-heading"><div class="eyebrow">${kicker}</div><h2>${title}</h2><p>${subtitle}</p></div>`}
function cards(ids){return `<div class="app-grid">${ids.map(id=>{const a=apps.find(x=>x.id===id);return `<button class="app-card" data-open="${id}">${icon(id)}<span><strong>${a.name}</strong><small>${a.sub}</small></span></button>`}).join('')}</div>`}
function appsBody(){return head('Explore','Everything in your workspace, in one place.','APP LIBRARY')+`<div class="app-content"><p class="section-title">Open an app</p>${cards(['browser','games','movies','roblox','minecraft','anime','images','notes','settings','about'])}</div>`}
function gamesBody(){return head('Game zone','Choose a destination. It will open inside the Safe Bucket browser window.','PLAY')+`<div class="app-content"><p class="section-title">Game destinations</p><div class="app-grid">${[['Roblox','Play and explore','https://www.roblox.com/'],['Eaglercraft','Browser Minecraft','https://eaglercraft.com/'],['CrazyGames','Browser games','https://www.crazygames.com/'],['Poki','Online games','https://poki.com/'],['itch.io','Indie games','https://itch.io/games']].map(([n,d,u])=>`<button class="app-card" data-site="${u}">${icon('games')}<span><strong>${n}</strong><small>${d} · Open inside Safe Bucket</small></span></button>`).join('')}</div></div>`}
function moviesBody(){return head('Watch & discover','Video destinations open inside your Safe Bucket browser window.','MEDIA')+`<div class="app-content"><div class="app-grid">${[['YouTube','Videos, creators, and music','https://www.youtube.com/'],['YouTube Kids','Kid-focused video experience','https://www.youtubekids.com/'],['Tubi','Movies and shows','https://tubitv.com/'],['Internet Archive','Public-domain collections','https://archive.org/details/movies']].map(([n,d,u])=>`<button class="app-card" data-site="${u}">${icon('movies')}<span><strong>${n}</strong><small>${d}</small></span></button>`).join('')}</div><p style="font-size:10px;color:#999;line-height:1.7;margin-top:18px">Some services may refuse to display inside another website. Safe Bucket will keep you in this workspace and show a message if embedding is blocked.</p></div>`}
function destinationBody(id){const d={roblox:['Roblox','https://www.roblox.com/'],minecraft:['Minecraft','https://www.minecraft.net/'],anime:['Anime','https://www.crunchyroll.com/']}[id];return head(d[0],'Browse this destination in the built-in Safe Bucket browser.','DESTINATION')+`<div class="app-content"><button class="app-card" data-site="${d[1]}">${icon(id)}<span><strong>Open ${d[0]} here</strong><small>Loads in the Safe Bucket browser window</small></span></button><p style="font-size:11px;color:#aaa;line-height:1.7;margin-top:18px">If the website blocks embedding, this app stays open and explains the limitation. No new tab will be opened.</p></div>`}
function imagesBody(){const files=['SafeBucketLogo.png','Controller.png','Movie.png','Roblox.png','Minecraft.png','CiphAnonStudios.png','Anime.png','AltServer.png','AI.png'];return head('Image library','Your artwork appears here when the Images folder sits beside index.html.','ASSETS')+`<div class="app-content"><div class="gallery">${files.map(f=>`<div class="gallery-item"><div class="gallery-preview"><img src="${ASSET_DIR+f}" alt="${f}" onerror="this.style.display='none';this.parentElement.innerHTML='<span style=&quot;font-size:10px;color:#999&quot;>Not found</span>'"></div><strong>${f}</strong><small>Images / ${f}</small></div>`).join('')}</div></div>`}
function notesBody(){return `<div class="note-area"><div class="note-toolbar"><span>QUICK NOTE</span><span id="noteStatus">Saved on this device</span></div><textarea id="notesText" placeholder="Ideas, reminders, links…"></textarea><div style="display:flex;justify-content:flex-end;padding-top:10px"><button class="outline-btn" id="clearNotes">Clear note</button></div></div>`}
function settingsBody(){return head('Settings','A simple black-and-white workspace.','PREFERENCES')+`<div class="app-content"><div class="settings-list"><div class="setting-row"><div><strong>Desktop grid</strong><small>Toggle the subtle white outline grid.</small></div><button class="toggle" id="gridToggle" aria-label="Toggle desktop grid"></button></div><div class="setting-row"><div><strong>Quick notes</strong><small>Write notes that stay saved on this device.</small></div><button class="shortcut" data-open="notes">Open notes</button></div><div class="setting-row"><div><strong>Image library</strong><small>Preview Safe Bucket app artwork.</small></div><button class="shortcut" data-open="images">Open images</button></div></div><button class="outline-btn" id="resetSettings" style="margin-top:17px">Reset settings</button></div>`}
function aboutBody(){return `<div class="about-wrap"><div class="about-card"><div class="brand-mark">S</div><div class="eyebrow">CIPHANON STUDIOS</div><h2>Safe Bucket OS</h2><p>A custom black-and-white workspace for games, media, browsing, and ideas. Apps open as windows inside the same desktop.</p><span class="pill">One workspace</span><span class="pill">White outlines</span><span class="pill">Made by ToonyTime</span></div></div>`}
function browserHome(){return `<div class="browser-home"><div class="brand-mark">S</div><h2>Where to <span>next?</span></h2><p>Search the web or choose a shortcut.</p><form class="browser-search" data-browser-form><input data-browser-home-input placeholder="Search or enter a website…" autocomplete="off"><button type="submit" aria-label="Go">↵</button></form><div class="browser-shortcuts">${[['Search','https://www.google.com/'],['YouTube','https://www.youtube.com/'],['Roblox','https://www.roblox.com/'],['Eaglercraft','https://eaglercraft.com/']].map(([n,u])=>`<button class="shortcut" data-site="${u}">${n}</button>`).join('')}</div></div>`}
function browserBody(){return `<div class="browser-tabs" id="browserTabs"><button class="browser-tab active" data-tab="0"><span>New tab</span><span data-close-tab="0">×</span></button><button class="tool-btn" id="newTabBtn" title="New tab">＋</button></div><div class="browser-toolbar"><button class="tool-btn" data-nav="back" title="Back">‹</button><button class="tool-btn" data-nav="forward" title="Forward">›</button><button class="tool-btn" data-nav="reload" title="Reload">↻</button><button class="tool-btn" data-nav="home" title="Home">⌂</button><form class="addressbar" id="addressForm"><input id="browserAddress" placeholder="Search or enter a website address" autocomplete="off" spellcheck="false"><button class="tool-btn" type="submit" title="Go">↵</button></form></div><div class="browser-stage" id="browserView">${browserHome()}</div><div class="browser-status" id="browserStatus">Pages stay inside this window. Some websites block embedded viewing.</div>`}
function bodyFor(id){return ({browser:browserBody,apps:appsBody,games:gamesBody,movies:moviesBody,roblox:()=>destinationBody('roblox'),minecraft:()=>destinationBody('minecraft'),anime:()=>destinationBody('anime'),images:imagesBody,notes:notesBody,settings:settingsBody,about:aboutBody}[id]||appsBody)()}
function openApp(id){let w=windowMap[id];if(w){w.classList.remove('hidden');focusWindow(w);return w}const app=apps.find(a=>a.id===id)||{name:'Explore'};w=document.createElement('section');w.className='window active';w.dataset.window=id;w.style.zIndex=++zTop;w.innerHTML=`<div class="window-bar"><div class="traffic"><button data-win="close" title="Close" aria-label="Close"></button><button data-win="min" title="Minimize" aria-label="Minimize"></button><button data-win="max" title="Maximize" aria-label="Maximize"></button></div><div class="window-title">${app.name} · Safe Bucket OS</div></div><div class="window-body ${id==='browser'?'no-scroll':''}">${bodyFor(id)}</div>`;layer.appendChild(w);windowMap[id]=w;wireWindow(id,w);focusWindow(w);updateDock();return w}
function focusWindow(w){document.querySelectorAll('.window').forEach(x=>x.classList.remove('active'));w.classList.add('active');w.style.zIndex=++zTop;updateDock()}
function updateDock(){document.querySelectorAll('.dock-button').forEach(b=>b.classList.toggle('is-open',!!(windowMap[b.dataset.open]&&!windowMap[b.dataset.open].classList.contains('hidden'))))}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function getBrowserState(w){if(!browserStates.has(w))browserStates.set(w,{tabs:[{title:'New tab',url:'',history:[],index:-1}],active:0});return browserStates.get(w)}
function normalizedUrl(raw){raw=String(raw||'').trim();if(!raw)return '';if(/^https?:\/\//i.test(raw))return raw;if(/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(raw))return 'https://'+raw;return 'https://www.google.com/search?q='+encodeURIComponent(raw)}
function renderBrowserTabs(w){const s=getBrowserState(w),el=$('#browserTabs',w);el.innerHTML=s.tabs.map((t,i)=>`<button class="browser-tab ${i===s.active?'active':''}" data-tab="${i}" title="${t.title}"><span>${t.title}</span><span data-close-tab="${i}" aria-label="Close tab">×</span></button>`).join('')+'<button class="tool-btn" id="newTabBtn" title="New tab">＋</button>';el.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{s.active=Number(b.dataset.tab);showTab(w)});el.querySelectorAll('[data-close-tab]').forEach(x=>x.onclick=e=>{e.stopPropagation();const i=Number(x.dataset.closeTab);s.tabs.splice(i,1);if(!s.tabs.length)s.tabs.push({title:'New tab',url:'',history:[],index:-1});s.active=Math.max(0,Math.min(s.active,s.tabs.length-1));showTab(w)});$('#newTabBtn',w).onclick=()=>{s.tabs.push({title:'New tab',url:'',history:[],index:-1});s.active=s.tabs.length-1;showTab(w);$('#browserAddress',w).focus()}}
function showTab(w){const s=getBrowserState(w),t=s.tabs[s.active];renderBrowserTabs(w);$('#browserAddress',w).value=t.url||'';const view=$('#browserView',w);if(!t.url){view.innerHTML=browserHome();wireBrowserHome(w)}else loadFrame(w,t.url,false)}
function loadFrame(w,url,addHistory=true){const s=getBrowserState(w),t=s.tabs[s.active];if(addHistory){t.history=t.history.slice(0,t.index+1);t.history.push(url);t.index=t.history.length-1}t.url=url;try{t.title=new URL(url).hostname.replace(/^www\./,'')}catch{t.title='Search'}$('#browserAddress',w).value=url;renderBrowserTabs(w);const view=$('#browserView',w);view.innerHTML=`<iframe class="browser-frame" title="Web page" referrerpolicy="no-referrer" sandbox="allow-forms allow-scripts allow-same-origin" src="${url.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}"></iframe>`;$('#browserStatus',w).textContent='Loading inside Safe Bucket · If this site blocks embedding, it may not display here.';const frame=$('iframe',view);frame.addEventListener('load',()=>{try{const title=frame.contentDocument.title;if(title){t.title=title.slice(0,24);renderBrowserTabs(w)}}catch{}$('#browserStatus',w).textContent='Inside Safe Bucket · Some websites restrict embedded viewing.'})}
function navigateBrowser(w,raw){const url=normalizedUrl(raw);if(!url)return;loadFrame(w,url,true)}
function wireBrowserHome(w){const form=$('[data-browser-form]',w);if(form)form.onsubmit=e=>{e.preventDefault();navigateBrowser(w,$('[data-browser-home-input]',form).value)}}
function wireWindow(id,w){$('[data-win="close"]',w).onclick=()=>{w.classList.add('hidden');updateDock()};$('[data-win="min"]',w).onclick=()=>{w.classList.add('hidden');updateDock()};$('[data-win="max"]',w).onclick=()=>{w.classList.toggle('maximized');if(!w.classList.contains('maximized')){w.style.left='50%';w.style.top='50%';w.style.transform='translate(-50%,-50%)'}};w.addEventListener('pointerdown',()=>focusWindow(w));const bar=$('.window-bar',w);bar.addEventListener('pointerdown',e=>{if(e.target.closest('.traffic')||w.classList.contains('maximized')||e.pointerType==='touch'&&e.target.closest('button'))return;const rect=w.getBoundingClientRect(),sx=e.clientX,sy=e.clientY,ox=rect.left,oy=rect.top;const move=ev=>{w.style.left=Math.max(0,Math.min(window.innerWidth-100,ox+ev.clientX-sx+rect.width/2))+'px';w.style.top=Math.max(45,Math.min(window.innerHeight-60,oy+ev.clientY-sy+rect.height/2))+'px';w.style.transform='translate(-50%,-50%)'};const up=()=>{bar.removeEventListener('pointermove',move);bar.removeEventListener('pointerup',up);bar.removeEventListener('pointercancel',up)};bar.addEventListener('pointermove',move);bar.addEventListener('pointerup',up);bar.addEventListener('pointercancel',up)});
if(id==='browser'){const form=$('#addressForm',w);form.onsubmit=e=>{e.preventDefault();navigateBrowser(w,$('#browserAddress',w).value)};w.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{const s=getBrowserState(w),t=s.tabs[s.active];if(b.dataset.nav==='home'){t.url='';t.history=[];t.index=-1;showTab(w)}else if(b.dataset.nav==='reload'){if(t.url)loadFrame(w,t.url,false);else toast('Already on the start page.')}else if(b.dataset.nav==='back'){if(t.index>0){t.index--;t.url=t.history[t.index];showTab(w)}else toast('No earlier page in this tab.')}else if(b.dataset.nav==='forward'){if(t.index<t.history.length-1){t.index++;t.url=t.history[t.index];showTab(w)}else toast('No next page in this tab.')}});renderBrowserTabs(w);wireBrowserHome(w)}
if(id==='notes'){const ta=$('#notesText',w);try{ta.value=localStorage.getItem('sb-notes')||''}catch{}ta.addEventListener('input',()=>{try{localStorage.setItem('sb-notes',ta.value);$('#noteStatus',w).textContent='Saved just now'}catch{$('#noteStatus',w).textContent='Storage unavailable'}});$('#clearNotes',w).onclick=()=>{ta.value='';try{localStorage.removeItem('sb-notes')}catch{}$('#noteStatus',w).textContent='Cleared'}}
if(id==='settings'){const toggle=$('#gridToggle',w);toggle.classList.toggle('on',localStorage.getItem('sb-grid')!=='off');desktop.classList.toggle('no-grid',localStorage.getItem('sb-grid')==='off');toggle.onclick=()=>{toggle.classList.toggle('on');const on=toggle.classList.contains('on');desktop.classList.toggle('no-grid',!on);localStorage.setItem('sb-grid',on?'on':'off')};$('#resetSettings',w).onclick=()=>{localStorage.removeItem('sb-grid');desktop.classList.remove('no-grid');toggle.classList.add('on');toast('Settings reset')}}}
// All destination shortcuts are routed into the same built-in browser window. No window.open or target=_blank.
document.addEventListener('click',e=>{const open=e.target.closest('[data-open]');if(open){openApp(open.dataset.open);return}const site=e.target.closest('[data-site]');if(site){const w=openApp('browser');navigateBrowser(w,site.dataset.site);return}});
$('#quickSearchForm').onsubmit=e=>{e.preventDefault();const q=$('#quickSearch').value.trim();if(!q)return;const app=apps.find(a=>a.name.toLowerCase()===q.toLowerCase()||a.id===q.toLowerCase());if(app)openApp(app.id);else{const w=openApp('browser');navigateBrowser(w,q)}$('#quickSearch').value=''};
$('#hideWindows').onclick=()=>{Object.values(windowMap).forEach(w=>w.classList.add('hidden'));updateDock();toast('All app windows minimized')};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#quickSearch').focus()}if(e.key==='Escape'){$('#quickSearch').blur()}});function updateClock(){const d=new Date();$('#clock').textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}renderDesktop();updateClock();setInterval(updateClock,15000);
})();
</script></body></html>
