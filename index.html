
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101015">
<title>Safe Bucket Desktop</title>
<style>
:root {
  --orange:#ff6a00;
  --glass:rgba(25,25,32,.78);
  --line:rgba(255,255,255,.13);
  --text:#f7f5fa;
  --muted:#aaa7b4;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  height:100dvh;overflow:hidden;color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#101015;user-select:none
}
button,input{font:inherit}
button{color:inherit}
.wallpaper{
  position:fixed;inset:0;z-index:-3;
  background:
  radial-gradient(ellipse at 78% 28%,rgba(255,95,0,.34),transparent 31%),
  radial-gradient(ellipse at 15% 90%,rgba(112,48,186,.32),transparent 38%),
  linear-gradient(135deg,#09090e,#21131e 52%,#101018)
}
.wallpaper:before{
  content:"";position:absolute;inset:0;opacity:.55;
  background:repeating-linear-gradient(125deg,transparent 0 100px,rgba(255,255,255,.025) 101px 102px)
}
.orb{
  position:absolute;width:min(65vw,620px);aspect-ratio:1;
  right:-8%;top:8%;border-radius:50%;
  border:1px solid rgba(255,106,0,.25);
  box-shadow:0 0 100px #ff6a001c,inset 0 0 100px #ff6a0014
}
.orb:before,.orb:after{
  content:"";position:absolute;inset:12%;
  border:1px solid #ffffff14;border-radius:50%
}
.orb:after{inset:25%}

/* MENU BAR */
.menubar{
  position:fixed;z-index:50;top:0;left:0;right:0;height:38px;
  padding:0 15px;display:flex;align-items:center;
  justify-content:space-between;gap:12px;
  background:#0c0c10a8;backdrop-filter:blur(22px);
  border-bottom:1px solid #ffffff12;font-size:12px
}
.menu-left,.menu-right{display:flex;align-items:center;gap:14px}
.menu-left strong{font-weight:800;cursor:pointer}
.menu-left strong span{color:var(--orange)}
.menu-item{color:#d2ced8;cursor:pointer}
.menu-item:hover{color:white}
.menu-right{color:#e6e2ec;white-space:nowrap;gap:12px}
.status-dot{
  display:inline-block;width:7px;height:7px;border-radius:50%;
  background:#61e6a1;box-shadow:0 0 9px #61e6a166
}

/* DESKTOP SHORTCUTS */
.desktop-icons{
  position:absolute;top:53px;left:15px;
  display:grid;grid-template-columns:76px;
  grid-auto-rows:89px;gap:2px;z-index:1
}
.desktop-icon{
  width:76px;height:84px;display:flex;flex-direction:column;
  justify-content:center;align-items:center;gap:7px;
  border:1px solid transparent;border-radius:9px;
  background:transparent;color:white;cursor:pointer;text-align:center
}
.desktop-icon:hover,.desktop-icon:focus-visible{
  outline:none;background:#ffffff19;border-color:#ffffff12
}
.symbol{
  width:43px;height:43px;display:grid;place-items:center;
  border-radius:13px;font-size:23px;
  box-shadow:inset 0 1px #ffffff50,0 5px 16px #0003
}
.desktop-icon span:last-child{
  font-size:11px;line-height:1.25;text-shadow:0 1px 5px #000
}
.ic-orange{background:linear-gradient(145deg,#ff9a46,#e94b00)}
.ic-blue{background:linear-gradient(145deg,#69c8ff,#1766d6)}
.ic-purple{background:linear-gradient(145deg,#bb8aff,#6535cb)}
.ic-green{background:linear-gradient(145deg,#80edb1,#168a59)}
.ic-red{background:linear-gradient(145deg,#ff8989,#cf303b)}
.ic-yellow{background:linear-gradient(145deg,#ffe77b,#d99800)}
.ic-dark{background:linear-gradient(145deg,#55515f,#25232c)}

/* CENTER WELCOME */
.welcome{
  position:absolute;left:50%;top:43%;
  transform:translate(-50%,-50%);
  width:min(560px,calc(100% - 135px));
  text-align:center;animation:fade .65s ease both
}
.eyebrow{
  color:#ffab70;font-size:10px;text-transform:uppercase;
  letter-spacing:4px;margin-bottom:17px
}
h1{font-size:clamp(37px,6vw,65px);letter-spacing:-3px;line-height:1.05}
h1 span{color:var(--orange)}
.subtitle{color:#c0bbc7;font-size:14px;margin-top:14px}
.search{
  margin:30px auto 0;width:100%;display:flex;align-items:center;
  gap:11px;padding:7px 8px 7px 17px;
  background:#ffffff12;border:1px solid var(--line);
  border-radius:15px;backdrop-filter:blur(18px);
  box-shadow:0 15px 50px #0002
}
.search .magnify{color:#aaa3b3;font-size:22px}
.search input{
  flex:1;min-width:0;background:transparent;border:0;outline:0;
  color:white;font-size:14px;padding:10px 0;user-select:text
}
.search input::placeholder{color:#aaa4b2}
.search button,.primary{
  border:0;background:var(--orange);color:#17100b;
  font-weight:750;padding:11px 16px;border-radius:10px;
  cursor:pointer;transition:.2s
}
.search button:hover,.primary:hover{background:#ff9145}
.quick-links{
  display:flex;justify-content:center;gap:12px;
  margin-top:23px;flex-wrap:wrap
}
.quick-link{
  display:flex;align-items:center;gap:7px;
  border:1px solid #ffffff12;background:#ffffff08;
  padding:9px 12px;border-radius:11px;color:#e8e4ed;
  font-size:11px;cursor:pointer
}
.quick-link:hover{background:#ffffff18}

/* DOCK */
.dock-wrap{
  position:fixed;left:50%;bottom:17px;transform:translateX(-50%);
  width:max-content;max-width:calc(100vw - 20px);z-index:40;
  animation:dockIn .6s ease both
}
.dock{
  display:flex;align-items:flex-end;justify-content:center;gap:8px;
  padding:10px 12px 8px;max-width:calc(100vw - 20px);
  overflow-x:auto;scrollbar-width:none;
  background:#1b1925c9;border:1px solid #ffffff25;
  border-radius:22px;backdrop-filter:blur(28px) saturate(150%);
  box-shadow:0 15px 50px #0007,inset 0 1px #ffffff12
}
.dock::-webkit-scrollbar{display:none}
.dock-item{
  flex:0 0 51px;width:51px;border:0;background:transparent;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  cursor:pointer;position:relative
}
.dock-icon{
  width:45px;height:45px;display:grid;place-items:center;
  border-radius:14px;font-size:22px;
  box-shadow:inset 0 1px #ffffff45;
  transition:transform .18s ease,filter .18s ease
}
.dock-item:hover .dock-icon{
  transform:translateY(-8px) scale(1.1);filter:brightness(1.15)
}
.dock-label{font-size:9px;white-space:nowrap;color:#e8e4ed}
.dock-item.active:after{
  content:"";position:absolute;bottom:-5px;width:4px;height:4px;
  border-radius:50%;background:white
}
.dock-divider{width:1px;height:42px;background:#ffffff25;flex:0 0 1px;margin:0 2px}

/* APP WINDOWS */
.window{
  position:absolute;z-index:10;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:min(650px,calc(100vw - 35px));
  height:min(450px,calc(100dvh - 145px));
  min-height:220px;display:none;flex-direction:column;
  background:rgba(24,23,30,.94);border:1px solid #ffffff25;
  border-radius:15px;overflow:hidden;
  backdrop-filter:blur(30px);
  box-shadow:0 25px 100px #0008;
  animation:windowIn .18s ease
}
.window.open{display:flex}
.window-header{
  height:43px;flex-shrink:0;display:flex;align-items:center;
  gap:8px;padding:0 13px;background:#ffffff08;
  border-bottom:1px solid #ffffff12;cursor:grab;touch-action:none
}
.window-header:active{cursor:grabbing}
.traffic{display:flex;gap:6px;margin-right:8px}
.traffic button{width:12px;height:12px;border:0;border-radius:50%;cursor:pointer}
.close{background:#ff625a}
.minimize{background:#ffbd44}
.expand{background:#35c96b}
.window-title{font-size:12px;font-weight:650;flex:1}
.window-body{padding:22px;overflow:auto;flex:1;user-select:text}
.window-body h2{font-size:23px;margin-bottom:10px}
.window-body p{color:#c4bfcd;font-size:13px;line-height:1.65}
.app-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px;margin-top:20px}
.app-card{
  padding:17px 12px;border:1px solid #ffffff12;
  border-radius:12px;background:#ffffff08;text-align:center;cursor:pointer
}
.app-card:hover{background:#ffffff14}
.app-card .symbol{margin:0 auto 10px}
.app-card b{display:block;font-size:12px;margin-bottom:5px}
.app-card small{font-size:10px;color:var(--muted)}
.app-input{
  width:100%;margin-top:12px;background:#ffffff0c;color:white;
  border:1px solid #ffffff1c;border-radius:9px;
  padding:12px;outline:none;user-select:text
}
.app-button{
  border:1px solid #ffffff1b;background:#ffffff0b;color:white;
  border-radius:9px;padding:10px 13px;cursor:pointer;margin-top:10px
}
.app-button:hover{background:#ffffff18}
.note{color:var(--muted);font-size:11px;margin-top:10px}

/* CONTEXT MENU */
.context-menu{
  display:none;position:fixed;z-index:100;width:185px;
  background:#211f29f5;border:1px solid #ffffff20;
  border-radius:12px;padding:6px;box-shadow:0 10px 40px #0008;
  backdrop-filter:blur(20px)
}
.context-menu.show{display:block}
.context-menu button{
  display:block;width:100%;text-align:left;border:0;
  background:transparent;color:white;padding:10px;
  border-radius:7px;font-size:12px;cursor:pointer
}
.context-menu button:hover{background:#ffffff15}
.toast{
  position:fixed;z-index:110;bottom:100px;left:50%;
  transform:translateX(-50%);background:#25232c;
  border:1px solid #ffffff20;padding:11px 17px;
  border-radius:10px;font-size:12px;display:none;
  box-shadow:0 10px 35px #0005
}
.toast.show{display:block;animation:fade .2s ease}

@keyframes fade{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
@keyframes dockIn{from{opacity:0;bottom:0}to{opacity:1;bottom:17px}}
@keyframes windowIn{from{opacity:0;scale:.98}to{opacity:1;scale:1}}

@media(max-width:600px){
  .menubar{padding:0 10px}
  .menu-left,.menu-right{gap:8px}
  .menu-item.optional{display:none}
  .desktop-icons{left:5px;grid-template-columns:66px;grid-auto-rows:78px}
  .desktop-icon{width:65px;height:75px}
  .symbol{width:38px;height:38px;font-size:21px}
  .desktop-icon span:last-child{font-size:10px}
  .welcome{top:42%;width:calc(100% - 95px);left:calc(50% + 28px)}
  h1{font-size:clamp(30px,8vw,48px);letter-spacing:-2px}
  .subtitle{font-size:12px}
  .search{margin-top:22px;gap:8px;padding-left:11px}
  .search button{padding:10px;font-size:12px}
  .quick-links{gap:7px;margin-top:16px}
  .quick-link{padding:8px;font-size:10px}
  .dock{gap:4px;padding:9px 8px 8px}
  .dock-item{flex-basis:43px;width:43px}
  .dock-icon{width:38px;height:38px;font-size:19px;border-radius:12px}
  .dock-label{font-size:8px}
  .dock-divider{height:34px}
  .window{height:min(430px,calc(100dvh - 125px))}
  .window-body{padding:17px}
}
@media(max-height:500px){
  .welcome{top:40%}
  .eyebrow{margin-bottom:7px}
  .subtitle{margin-top:7px}
  .search{margin-top:12px}
  .quick-links{margin-top:9px}
  .desktop-icons{grid-auto-rows:68px}
  .desktop-icon{height:65px;gap:3px}
  .dock-wrap{bottom:5px}
}
</style>
</head>

<body>
<div class="wallpaper"><div class="orb"></div></div>

<header class="menubar">
  <div class="menu-left">
    <strong onclick="closeAll()">Safe<span>Bucket</span></strong>
    <span class="menu-item" onclick="openApp('about')">About</span>
    <span class="menu-item optional" onclick="openApp('apps')">Apps</span>
    <span class="menu-item optional" onclick="openApp('settings')">Settings</span>
  </div>
  <div class="menu-right">
    <span title="Desktop status"><i class="status-dot"></i></span>
    <span id="date">Oct 9</span>
    <span id="clock">12:00 PM</span>
    <span style="cursor:pointer" onclick="openApp('settings')" title="Settings">⚙</span>
  </div>
</header>

<!-- DESKTOP SHORTCUTS -->
<div class="desktop-icons">
  <button class="desktop-icon" onclick="openApp('browser')">
    <span class="symbol ic-orange">🌐</span><span>Browser</span>
  </button>
  <button class="desktop-icon" onclick="openApp('apps')">
    <span class="symbol ic-blue">▦</span><span>Applications</span>
  </button>
  <button class="desktop-icon" onclick="openApp('games')">
    <span class="symbol ic-purple">🎮</span><span>Games</span>
  </button>
  <button class="desktop-icon" onclick="openApp('notes')">
    <span class="symbol ic-yellow">📝</span><span>Notes</span>
  </button>
  <button class="desktop-icon" onclick="openApp('about')">
    <span class="symbol ic-dark">ⓘ</span><span>About</span>
  </button>
</div>

<!-- CENTER DESKTOP -->
<main class="welcome">
  <div class="eyebrow">CiphAnon Studios</div>
  <h1>Welcome <span>back.</span></h1>
  <p class="subtitle">Your desktop. Your corner of the internet.</p>

  <form class="search" id="searchForm">
    <span class="magnify">⌕</span>
    <input id="searchInput" placeholder="Search the web or enter a URL..." autocomplete="off">
    <button type="submit">Search ↗</button>
  </form>

  <div class="quick-links">
    <button class="quick-link" onclick="openApp('browser')">🌐 Browser</button>
    <button class="quick-link" onclick="openApp('games')">🎮 Games</button>
    <button class="quick-link" onclick="openApp('apps')">▦ Apps</button>
  </div>
</main>

<!-- APP WINDOWS -->
<section class="window" id="appWindow">
  <header class="window-header" id="windowHeader">
    <div class="traffic">
      <button class="close" onclick="closeWindow()" aria-label="Close"></button>
      <button class="minimize" onclick="minimizeWindow()" aria-label="Minimize"></button>
      <button class="expand" onclick="toggleMaximize()" aria-label="Maximize"></button>
    </div>
    <span class="window-title" id="windowTitle">Application</span>
    <span style="color:#aaa;font-size:11px">Safe Bucket</span>
  </header>
  <div class="window-body" id="windowBody"></div>
</section>

<!-- MAC-STYLE DOCK -->
<nav class="dock-wrap" aria-label="Application dock">
  <div class="dock">
    <button class="dock-item" onclick="closeAll()" title="Desktop">
      <span class="dock-icon ic-dark">⌂</span><span class="dock-label">Desktop</span>
    </button>
    <button class="dock-item" onclick="openApp('browser')" title="Browser">
      <span class="dock-icon ic-orange">🌐</span><span class="dock-label">Browser</span>
    </button>
    <button class="dock-item" onclick="openApp('apps')" title="Applications">
      <span class="dock-icon ic-blue">▦</span><span class="dock-label">Apps</span>
    </button>
    <button class="dock-item" onclick="openApp('games')" title="Games">
      <span class="dock-icon ic-purple">🎮</span><span class="dock-label">Games</span>
    </button>
    <button class="dock-item" onclick="openApp('notes')" title="Notes">
      <span class="dock-icon ic-yellow">📝</span><span class="dock-label">Notes</span>
    </button>
    <span class="dock-divider"></span>
    <button class="dock-item" onclick="openApp('settings')" title="Settings">
      <span class="dock-icon ic-dark">⚙</span><span class="dock-label">Settings</span>
    </button>
    <button class="dock-item" onclick="openApp('about')" title="About">
      <span class="dock-icon ic-green">ⓘ</span><span class="dock-label">About</span>
    </button>
  </div>
</nav>

<div class="context-menu" id="contextMenu">
  <button onclick="openApp('browser');hideContext()">Open Browser</button>
  <button onclick="openApp('apps');hideContext()">Applications</button>
  <button onclick="openApp('settings');hideContext()">Desktop Settings</button>
  <button onclick="closeAll();hideContext()">Show Desktop</button>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const win = $('appWindow');
const body = $('windowBody');
const title = $('windowTitle');

let highestZ = 10;
let maximized = false;
let oldRect = null;
let drag = null;
let toastTimer;

function updateClock(){
  const now = new Date();
  $('clock').textContent = now.toLocaleTimeString([], {
    hour:'numeric', minute:'2-digit'
  });
  $('date').textContent = now.toLocaleDateString([], {
    month:'short', day:'numeric'
  });
}
updateClock();
setInterval(updateClock, 1000);

function notify(message){
  const t = $('toast');
  t.textContent = message;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'),2400);
}

function closeWindow(){
  win.classList.remove('open');
  maximized = false;
  win.style.cssText = '';
  updateDock();
}
function minimizeWindow(){ closeWindow(); }
function closeAll(){
  closeWindow();
  document.querySelectorAll('.dock-item').forEach(b=>b.classList.remove('active'));
}
function updateDock(){
  document.querySelectorAll('.dock-item').forEach(b=>b.classList.remove('active'));
}

function openApp(name){
  const pages = {
    about: {
      title:'About Safe Bucket',
      html:`<h2>Safe <span style="color:var(--orange)">Bucket.</span></h2>
        <p>A desktop experience by CiphAnon Studios.</p>
        <div class="app-grid">
          <div class="app-card"><div class="symbol ic-orange">S</div><b>Safe Bucket</b><small>Desktop interface</small></div>
          <div class="app-card"><div class="symbol ic-purple">✦</div><b>CiphAnon</b><small>Creative projects</small></div>
        </div>
        <p class="note">This is a browser-based desktop simulation, not a separate operating system.</p>`
    },
    apps: {
      title:'Applications',
      html:`<h2>Applications</h2><p>Choose an application to open.</p>
        <div class="app-grid">
          ${card('ic-orange','🌐','Browser','Search the web','browser')}
          ${card('ic-purple','🎮','Games','Game shortcuts','games')}
          ${card('ic-yellow','📝','Notes','Write a note','notes')}
          ${card('ic-dark','⚙','Settings','Customize desktop','settings')}
          ${card('ic-green','ⓘ','About','About this desktop','about')}
        </div>`
    },
    browser: {
      title:'Browser',
      html:`<h2>Web Browser</h2>
        <p>Enter a website address or search the web.</p>
        <form id="browserForm">
          <input class="app-input" id="browserAddress" placeholder="https://example.com">
          <button class="primary" type="submit">Go ↗</button>
        </form>
        <div class="app-grid">
          <div class="app-card" onclick="navigateTo('https://www.google.com')"><div class="symbol ic-blue">G</div><b>Google</b><small>Search</small></div>
          <div class="app-card" onclick="navigateTo('https://www.wikipedia.org')"><div class="symbol ic-dark">W</div><b>Wikipedia</b><small>Knowledge</small></div>
          <div class="app-card" onclick="navigateTo('https://www.youtube.com')"><div class="symbol ic-red">▶</div><b>YouTube</b><small>Videos</small></div>
        </div>
        <p class="note">Websites open in a new browser tab. This desktop does not proxy or embed them.</p>`
    },
    games: {
      title:'Games',
      html:`<h2>Game Center</h2><p>Your game shortcuts in one place.</p>
        <div class="app-grid">
          <div class="app-card" onclick="navigateTo('https://www.roblox.com')"><div class="symbol ic-red">🎮</div><b>Roblox</b><small>Open website ↗</small></div>
          <div class="app-card" onclick="navigateTo('https://eaglercraft.com')"><div class="symbol ic-green">⛏</div><b>Eaglercraft</b><small>Open website ↗</small></div>
          <div class="app-card" onclick="navigateTo('https://www.crazygames.com')"><div class="symbol ic-purple">✦</div><b>Web Games</b><small>Open website ↗</small></div>
        </div>
        <p class="note">Game availability depends on your device and network.</p>`
    },
    notes: {
      title:'Notes',
      html:`<h2>Quick Notes</h2><p>Write something for this session.</p>
        <textarea id="notesText" class="app-input" rows="7" placeholder="Start typing..." style="resize:vertical"></textarea>
        <button class="primary" onclick="saveNote()">Save Note</button>
        <p id="noteStatus" class="note">Notes are kept in this page session only.</p>`
    },
    settings: {
      title:'Desktop Settings',
      html:`<h2>Personalize</h2><p>Change the desktop accent color.</p>
        <div class="app-grid">
          <div class="app-card" onclick="setAccent('#ff6a00')"><div class="symbol ic-orange">●</div><b>Orange</b><small>CiphAnon</small></div>
          <div class="app-card" onclick="setAccent('#6d8cff')"><div class="symbol ic-blue">●</div><b>Blue</b><small>Cool</small></div>
          <div class="app-card" onclick="setAccent('#b36cff')"><div class="symbol ic-purple">●</div><b>Purple</b><small>Neon</small></div>
          <div class="app-card" onclick="setAccent('#35c98a')"><div class="symbol ic-green">●</div><b>Green</b><small>Fresh</small></div>
        </div>
        <button class="app-button" onclick="resetWallpaper()">Reset Wallpaper</button>
        <p class="note">Accent settings apply to the current page session.</p>`
    }
  };

  const page = pages[name] || pages.about;
  title.textContent = page.title;
  body.innerHTML = page.html;
  win.classList.add('open');
  win.style.zIndex = ++highestZ;
  maximized = false;
  win.style.left = '50%';
  win.style.top = '50%';
  win.style.transform = 'translate(-50%,-50%)';
  win.style.width = '';
  win.style.height = '';
  updateDock();

  if(name === 'browser'){
    $('browserForm').addEventListener('submit',e=>{
      e.preventDefault();
      navigateTo($('browserAddress').value);
    });
  }
  if(name === 'notes'){
    $('notesText').value = sessionNote;
  }
}

function card(color,emoji,name,description,app){
  return `<div class="app-card" onclick="openApp('${app}')">
    <div class="symbol ${color}">${emoji}</div>
    <b>${name}</b><small>${description}</small>
  </div>`;
}

function navigateTo(value){
  let q = (value || '').trim();
  if(!q){notify('Enter a website or search term.');return;}
  let url;
  if(/^https?:\/\//i.test(q)){
    url=q;
  }else if(/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(q) && !q.includes(' ')){
    url='https://'+q;
  }else{
    url='https://www.google.com/search?q='+encodeURIComponent(q);
  }
  window.open(url,'_blank','noopener');
}

$('searchForm').addEventListener('submit',e=>{
  e.preventDefault();
  navigateTo($('searchInput').value);
});

let sessionNote = '';
function saveNote(){
  sessionNote = $('notesText').value;
  $('noteStatus').textContent = 'Saved for this page session.';
  notify('Note saved for this session.');
}

function setAccent(color){
  document.documentElement.style.setProperty('--orange',color);
  notify('Accent color updated.');
}
function resetWallpaper(){
  document.querySelector('.wallpaper').style.background = '';
  document.querySelector('.wallpaper').style.background = `
    radial-gradient(ellipse at 78% 28%,rgba(255,95,0,.34),transparent 31%),
    radial-gradient(ellipse at 15% 90%,rgba(112,48,186,.32),transparent 38%),
    linear-gradient(135deg,#09090e,#21131e 52%,#101018)`;
  notify('Wallpaper reset.');
}

/* MAXIMIZE / RESTORE */
function toggleMaximize(){
  if(!maximized){
    oldRect = {
      left:win.style.left,top:win.style.top,
      transform:win.style.transform,width:win.style.width,
      height:win.style.height
    };
    win.style.left='10px';
    win.style.top='49px';
    win.style.transform='none';
    win.style.width='calc(100vw - 20px)';
    win.style.height='calc(100dvh - 145px)';
    maximized=true;
  }else{
    win.style.left=oldRect.left || '50%';
    win.style.top=oldRect.top || '50%';
    win.style.transform=oldRect.transform || 'translate(-50%,-50%)';
    win.style.width=oldRect.width || '';
    win.style.height=oldRect.height || '';
    maximized=false;
  }
}

/* DRAG WINDOW WITH MOUSE OR TOUCH */
const header=$('windowHeader');
header.addEventListener('pointerdown',e=>{
  if(e.target.tagName==='BUTTON')return;
  if(maximized)return;
  const r=win.getBoundingClientRect();
  win.style.transform='none';
  win.style.left=r.left+'px';
  win.style.top=r.top+'px';
  drag={x:e.clientX-r.left,y:e.clientY-r.top};
  header.setPointerCapture(e.pointerId);
});
header.addEventListener('pointermove',e=>{
  if(!drag)return;
  const r=win.getBoundingClientRect();
  win.style.left=Math.max(0,Math.min(innerWidth-r.width,e.clientX-drag.x))+'px';
  win.style.top=Math.max(38,Math.min(innerHeight-r.height-90,e.clientY-drag.y))+'px';
});
header.addEventListener('pointerup',()=>drag=null);
header.addEventListener('pointercancel',()=>drag=null);

/* DESKTOP RIGHT-CLICK MENU */
const context=$('contextMenu');
function hideContext(){context.classList.remove('show')}
document.addEventListener('contextmenu',e=>{
  if(e.target.closest('.window'))return;
  e.preventDefault();
  context.style.left=Math.min(e.clientX,innerWidth-195)+'px';
  context.style.top=Math.min(e.clientY,innerHeight-180)+'px';
  context.classList.add('show');
});
document.addEventListener('click',e=>{
  if(!e.target.closest('.context-menu'))hideContext();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeWindow();hideContext();}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){
    e.preventDefault();$('searchInput').focus();
  }
});
</script>
